[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nn_models"
version = "0.1.0"
description = "predefined neural network models - classical and hybrid"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0", "perceval_quandela>=0.11.0",
    "pandas"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
datasets = [
    "scikit-learn>=1.0.0", "pandas", "numpy"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["nn_models", "datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

