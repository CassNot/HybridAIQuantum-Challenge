[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcvl_pytorch"
version = "0.1.6"
description = "Quantum optical circuit simulation using SLOS algorithm in pytorch"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pcvl_pytorch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]